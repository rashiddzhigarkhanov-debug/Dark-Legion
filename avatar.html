<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аватарка с рамкой — [DN09]</title>
    <style>
        body {
            background-color: #121214; color: #e1e1e6;
            font-family: sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; margin: 0;
        }
        .container {
            background: #1f1f23; border: 1px solid #29292e;
            padding: 30px; border-radius: 16px; text-align: center; max-width: 400px; width: 90%;
        }
        .canvas-container {
            position: relative; width: 250px; height: 250px; margin: 20px auto;
            border: 2px dashed #41414d; border-radius: 12px; overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        .btn {
            background: #e1e1e6; color: #121214; border: none; padding: 12px 24px;
            font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%;
        }
        .btn:disabled { background: #41414d; color: #737380; cursor: not-allowed; }
        .control-group { margin: 15px 0; text-align: left; }
        input[type="range"] { width: 100%; }
        .back-link { color: #a8a8b3; text-decoration: none; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Создать аватарку альянса</h2>
    <p style="color: #a8a8b3; font-size: 14px;">Выберите фото, настройте масштаб и сохраните</p>

    <div class="control-group">
        <input type="file" id="imageLoader" accept="image/*">
    </div>

    <div class="canvas-container">
        <canvas id="avatarCanvas" width="500" height="500"></canvas>
    </div>

    <div class="control-group">
        <label for="scaleSlider">Масштаб фотографии:</label>
        <input type="range" id="scaleSlider" min="0.1" max="3" step="0.01" value="1" disabled>
    </div>

    <button class="btn" id="downloadBtn" disabled>Скачать аватарку</button>
    

    <a href="index.html" class="back-link">← На главную</a>
</div>

<script>
    const imageLoader = document.getElementById('imageLoader');
    const canvas = document.getElementById('avatarCanvas');
    const ctx = canvas.getContext('2d');
    const scaleSlider = document.getElementById('scaleSlider');
    const downloadBtn = document.getElementById('downloadBtn');

    let userImg = new Image();
    let frameImg = new Image();
    frameImg.src = 'alliance-frame.png'; // Сюда потом загрузим рамку

    let scale = 1;

    imageLoader.addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = function(event){
            userImg.onload = function(){
                scaleSlider.disabled = false;
                downloadBtn.disabled = false;
                scale = 1;
                scaleSlider.value = 1;
                draw();
            }
            userImg.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files);
    });

    scaleSlider.addEventListener('input', (e) => {
        scale = parseFloat(e.target.value);
        draw();
    });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (userImg.src) {
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(scale, scale);
            ctx.drawImage(userImg, -userImg.width / 2, -userImg.height / 2);
            ctx.restore();
        }
        
        ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
    }

    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'dark-legion-avatar.png';
        link.href = canvas.toDataURL();
        link.click();
    });
</script>

</body>
</html>
